<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qureo Runner</title>
    <style>
        body { background-color: #1a1f1c; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #232a25; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; color: #8bc34a; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #1a1f1c; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #8bc34a; border: none; border-radius: 5px; color: #1a1f1c; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #9ccc65; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Trio Coders (نسختنا)</h2>
        <input type="text" id="studentId" placeholder="كود الطالب (ID)">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">تسجيل الدخول</button>
        <div id="message"></div>
    </div>

    <script>
        async function login() {
            const id = document.getElementById('studentId').value;
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('message');
            
            msg.style.color = 'yellow';
            msg.innerText = 'جاري تسجيل الدخول...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId: id, password: pass })
                });
                const data = await response.json();
                
                if(data.success) {
                    msg.style.color = '#8bc34a';
                    msg.innerText = data.message;
                } else {
                    msg.style.color = 'red';
                    msg.innerText = data.message;
                }
            } catch (error) {
                msg.style.color = 'red';
                msg.innerText = 'حدث خطأ في الاتصال بالسيرفر';
            }
        }
    </script>
</body>
</html>
